name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push supersedes a run still in progress on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      # Both apps have to build. A green suite over a broken bundle is the
      # failure this catches.
      - run: npm run build

