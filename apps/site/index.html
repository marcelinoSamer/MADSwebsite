<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/Logos/logo2.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="MADS is the AUC student association for mathematics, actuarial science, and data science — competitions, industry talks, workshops, and a community that takes ideas seriously."
    />
    <meta name="theme-color" content="#0A3B5E" />
    <title>MADS — Mathematics, Actuarial & Data Science Association</title>

    <!--
      Brand faces are Telegraf (titles) and Garet (body). Both are licensed
      and have no public CDN, so they are self-hosted via @font-face in
      App.css from public/fonts/. These two are the fallback substitutes and
      are loaded only so the site is typographically correct before those
      files land: Archivo ≈ Telegraf's wide grotesque, Jost ≈ Garet's
      geometric sans. Remove them once the licensed files are in place.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@110,600;110,700&family=Jost:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
